<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(120deg, #1567c5 0%, #2f54b7 45%, #b2379f 100%);
      overflow: hidden;
      color: #fff;
      position: relative;
    }

    /* Soft curved line decoration */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 140vw;
      height: 140vw;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      pointer-events: none;
    }

    body::before {
      top: -95vw;
      left: -72vw;
      transform: rotate(12deg);
    }

    body::after {
      bottom: -100vw;
      right: -70vw;
      transform: rotate(-15deg);
    }

    .ring {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 50%;
      pointer-events: none;
    }

    .ring.top {
      width: 110vw;
      height: 110vw;
      top: -76vw;
      left: -45vw;
    }

    .ring.bottom {
      width: 100vw;
      height: 100vw;
      bottom: -72vw;
      right: -35vw;
    }

    .login-card {
      width: 320px;
      padding: 18px 28px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      backdrop-filter: blur(0.5px);
    }

    .title {
      text-align: center;
      font-size: 38px;
      font-weight: 300;
      letter-spacing: 0.6px;
      margin-bottom: 20px;
      color: rgba(255, 255, 255, 0.9);
    }

    .field {
      position: relative;
      margin-bottom: 12px;
    }

    .field .icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.55);
      font-size: 13px;
      line-height: 1;
    }

    .field input {
      width: 100%;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      outline: none;
      background: rgba(240, 242, 255, 0.18);
      color: #fff;
      border-radius: 2px;
      padding: 0 10px 0 32px;
      font-size: 12px;
    }

    .field input::placeholder {
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 1px 16px;
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.78);
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .remember input {
      accent-color: rgba(255, 255, 255, 0.75);
      width: 11px;
      height: 11px;
    }

    .forgot {
      color: rgba(255, 255, 255, 0.78);
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      height: 34px;
      border: none;
      border-radius: 999px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.95);
      background: linear-gradient(90deg, rgba(213, 217, 245, 0.65), rgba(197, 203, 237, 0.65));
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .submit-btn:hover {
      filter: brightness(1.08);
    }

    .submit-btn:active {
      filter: brightness(0.95);
    }
  </style>
</head>
<body>
  <span class="ring top" aria-hidden="true"></span>
  <span class="ring bottom" aria-hidden="true"></span>

  <form class="login-card" action="#" method="post" autocomplete="on">
    <h1 class="title">Login</h1>

    <div class="field">
      <span class="icon">👤</span>
      <input type="text" name="username" placeholder="User Name" required>
    </div>

    <div class="field">
      <span class="icon">🔒</span>
      <input type="password" name="password" placeholder="Password" required>
    </div>

    <div class="options">
      <label class="remember">
        <input type="checkbox" name="remember">
        <span>Remember Me</span>
      </label>
      <a href="#" class="forgot">Forgot Id ?</a>
    </div>

    <button type="submit" class="submit-btn">Login</button>
  </form>
</body>
</html>
